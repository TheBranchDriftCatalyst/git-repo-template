[project]
name = "backend"
version = "0.1.0"
# A floor, not a pin. The exact interpreter is declared in .python-version,
# which uv reads and will fetch if absent — nix deliberately does not provide
# python, so there is only one source of truth for the version.
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]

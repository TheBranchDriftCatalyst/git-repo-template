version: "3"

# Thin delegates to the yarn scripts in package.json, which are the single
# definition of every operation. `just` mirrors this file; neither runner is
# required — `yarn <script>` always works on its own.
#
# Nothing here reimplements logic. If a recipe would need more than a
# delegation, it belongs in package.json's scripts instead, so that CI, the
# git hooks and both runners all invoke the same thing.

tasks:
  default:
    desc: "Show available tasks"
    cmds:
      - task --list

  install:
    desc: "Install tooling and git hooks (yarn `prepare` runs lefthook install)"
    cmds:
      - yarn install

  test:
    desc: "Prettier check + markdown lint"
    cmds:
      - yarn test

  lint:
    desc: "Lint markdown"
    cmds:
      - yarn lint:md

  lint:fix:
    desc: "Lint markdown, fixing what can be fixed"
    cmds:
      - yarn lint:md:fix

  format:
    desc: "Format md/json/yaml with prettier"
    cmds:
      - yarn format

  format:check:
    desc: "Check formatting without writing"
    cmds:
      - yarn format:check

  # ─── Release ─────────────────────────────────────────────────
  # commit-and-tag-version bumps package.json, writes CHANGELOG.md, commits
  # and tags — all configured under the "commit-and-tag-version" key in
  # package.json. Pushing the tag is what triggers the GitHub Release
  # workflow. See RELEASE.md.
  release:dry:
    desc: "Preview the next version and changelog entry — writes nothing"
    cmds:
      - yarn release:dry

  release:
    desc: "Bump version, write CHANGELOG.md, commit and tag"
    cmds:
      - yarn release

  release:patch:
    desc: "Force a patch release"
    cmds:
      - yarn release:patch

  release:minor:
    desc: "Force a minor release"
    cmds:
      - yarn release:minor

  release:major:
    desc: "Force a major release"
    cmds:
      - yarn release:major

  release:push:
    desc: "Push the release commit and tag (triggers the GitHub Release)"
    cmds:
      - yarn release:push

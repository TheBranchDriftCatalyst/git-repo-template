name: CI

# Mirrors catalyst-agentic-sdlc — keep aligned so changes backport cleanly.
#
# Replaced a "detect project type" job that grepped the repo ROOT for
# package.json / pyproject.toml / go.mod and gated per-language jobs on the
# result. In a monorepo whose manifests live in subdirectories that detection
# matched nothing, so every job was skipped and CI reported success having run
# no checks at all. These jobs run unconditionally.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Lint markdown
        run: yarn lint:md

      - name: Prettier check
        run: yarn format:check

  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Lint commit messages in PR
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
